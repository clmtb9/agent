# Déploiement automatique sur GitHub Pages à chaque push sur main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (base /agent/ pour GitHub Pages)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Secrets du repo s'ils existent, sinon valeurs par défaut.
          # La clé anon Supabase est PUBLIQUE par design (embarquée dans le bundle JS
          # de toute façon) — la sécurité est assurée par la RLS sur toutes les tables.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://pqehebvoaguoekvynxbt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxZWhlYnZvYWd1b2VrdnlueGJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzU3MzAsImV4cCI6MjEwNzY1MTczMH0.I23naGXApGdBD6JWUETzVxeLnQXFxCvJ4K5WfaTZUiA' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
